[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyprep"
version = "0.1.0"
description = "Cryo-ET tilt-series preparation: GPU frame alignment and etomo-ready stacks, for Windows"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Evan Krystofiak" }]
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "tifffile",
    "imagecodecs",
    "PySide6",
    "pyqtgraph",
]

[project.optional-dependencies]
test = ["pytest"]
redep = ["astra-toolbox"]   # redeposition removal (ASTRA Toolbox: GPLv3, needs a CUDA GPU)

[project.scripts]
pyprep = "pyprep.cli:main"

[project.gui-scripts]
pyprep-gui = "pyprep.gui.launcher:main"

[tool.setuptools.packages.find]
include = ["pyprep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
